    <style>
      .boot-loader {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f8f5ef;
        color: #0b1f3a;
        font: 600 0.95rem Arial, sans-serif;
      }
      .boot-loader__mark {
        color: #c62828;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .boot-loader__spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid rgb(11 31 58 / 15%);
        border-top-color: #c62828;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader__spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="root"><div class="boot-loader" role="status" aria-live="polite"><span class="boot-loader__mark">FGCK</span><span class="boot-loader__spinner" aria-hidden="true"></span><span>Loading FGCK Christ Centre…</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
